#
# THIS FILE IS NOT USED BY THE BUILD.
#
# ZMK only merges `<exact-shield-name>.conf` from a shield directory, so for the
# `solanum_left` / `solanum_right` builds only solanum_left.conf and
# solanum_right.conf are read. A base-named file here is silently ignored
# (the "shared name applies to both halves" convention is only honoured inside
# the zmk-config `config/` directory). This was verified in the GitHub Actions
# build log: only `solanum_<side>.conf` appears under "Merged configuration".
#
# All real settings live in solanum_left.conf and solanum_right.conf.

