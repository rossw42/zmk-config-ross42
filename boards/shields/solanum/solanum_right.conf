# NOTE: ZMK only merges `<exact-shield-name>.conf` from a shield folder, i.e.
# THIS file for the `solanum_right` build. A base-named `solanum.conf` in the
# shield folder is silently ignored (the shared-name convention only applies to
# the zmk-config `config/` directory). Keep this file and solanum_left.conf in
# sync.

# Wired half-duplex split via the TRRS SERIAL line (pro_micro D3 / gpio0 20).
# Only one transport can be active in ZMK, so BLE is disabled here.
CONFIG_ZMK_BLE=n

# Sleep is primarily a BLE power-saving feature; not useful without BLE.
CONFIG_ZMK_SLEEP=n

# Wired split on nRF52 uses the async (DMA) UART API; make sure uart0 is
# built in async mode (mirrors solanum_left.conf, where the Studio snippet
# would otherwise force interrupt-driven mode).
CONFIG_UART_0_INTERRUPT_DRIVEN=n
CONFIG_UART_0_ASYNC=y

