# NOTE: ZMK only merges `<exact-shield-name>.conf` from a shield folder, i.e.
# THIS file for the `solanum_left` build. A base-named `solanum.conf` in the
# shield folder is silently ignored (the shared-name convention only applies to
# the zmk-config `config/` directory). Keep this file and solanum_right.conf in
# sync.

# Wired half-duplex split via the TRRS SERIAL line (pro_micro D3 / gpio0 20).
# Only one transport can be active in ZMK, so BLE is disabled here.
# The central still connects to the host over USB as normal.
CONFIG_ZMK_BLE=n

# Sleep is primarily a BLE power-saving feature; not useful without BLE.
CONFIG_ZMK_SLEEP=n

# The studio-rpc-usb-uart snippet forces CONFIG_UART_INTERRUPT_DRIVEN=y (for
# its USB CDC-ACM console). Zephyr then defaults UART_0_INTERRUPT_DRIVEN=y,
# which makes UART_0_ASYNC unavailable -- but ZMK's wired split on nRF52 uses
# the async (DMA) UART API, so uart_callback_set() fails and the wired split
# init aborts. Force the physical uart0 back to async mode; CDC-ACM keeps
# using the interrupt-driven API and is unaffected.
CONFIG_UART_0_INTERRUPT_DRIVEN=n
CONFIG_UART_0_ASYNC=y

# TEMPORARY DEBUG: USB log at WARN/ERR level only (a DBG-level log on the
# central floods the deferred logger and starves scanning -- seen earlier).
# ZMK's Kconfig hard-defaults ZMK_LOG_LEVEL=4 unless ZMK_LOGGING_MINIMAL is set,
# so the choice symbol alone is not enough; set both.
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_ZMK_LOG_LEVEL=2

